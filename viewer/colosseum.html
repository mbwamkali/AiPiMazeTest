<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colosseum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* The live 3D Colosseum: one big stage, a timeline under it, a showrunner ticker. Dark stadium look. */
:root {
  color-scheme: dark;
  --night: #10121c; --stand: #191c2b; --stand-2: #222639; --line: #2f3450;
  --chalk: #ece6d8; --dust: #a49e92; --torch: #ffb347; --boo: #ff5d5d; --cheer: #6fd39b;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--night); color: var(--chalk); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 12px max(14px, env(safe-area-inset-left)) 24px; display: grid; gap: 10px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: 1.9rem; text-transform: uppercase; margin: 0; letter-spacing: .02em; line-height: 1; }
select, button, input { font: 600 .85rem var(--f-body); background: var(--stand-2); color: var(--chalk); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; }
select { max-width: min(520px, 100%); }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--torch); }
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"] { background: var(--torch); color: #1b1408; border-color: var(--torch); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--torch); outline-offset: 2px; }
.spacer { flex: 1; }
a { color: var(--dust); }
.grp { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.grp > span { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dust); margin-right: 2px; }
.stage { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0b0c13; height: min(72vh, 820px); min-height: 360px; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.tl { position: absolute; inset: 10px auto auto 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; font-family: var(--f-mono); font-size: .75rem; max-width: 60%; }
.badge { background: var(--stand-2); color: var(--chalk); font-weight: 600; padding: 2px 8px; border-radius: 3px; letter-spacing: .1em; text-transform: uppercase; }
.badge.live { background: var(--boo); color: #1a0d0d; }
.badge.replay { background: var(--torch); color: #1b1408; }
.chip { background: rgba(16,18,28,.82); border: 1px solid var(--line); padding: 1px 8px; border-radius: 3px; color: var(--dust); }
.hud { position: absolute; inset: 10px 10px auto auto; display: grid; gap: 6px; width: min(250px, 40%); pointer-events: none; }
.hrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 8px; align-items: center; background: rgba(16,18,28,.84); border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; }
.hrow.win { border-color: var(--torch); }
.hrow i { width: 12px; height: 12px; border-radius: 50%; }
.hrow b { font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; text-transform: uppercase; line-height: 1; }
.hrow small { display: block; font-size: .68rem; color: var(--dust); }
.hrow span { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1rem; }
.hrow .bar { grid-column: 2 / 4; height: 3px; background: var(--stand-2); border-radius: 2px; overflow: hidden; }
.hrow .bar u { display: block; height: 100%; text-decoration: none; }
.label { position: absolute; transform: translate(-50%, -100%); font: 800 .8rem var(--f-display); text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 3px; background: rgba(16,18,28,.85); pointer-events: none; white-space: nowrap; }
.bubble { position: absolute; transform: translate(-50%, -100%); max-width: 260px; font: 500 .8rem var(--f-body); padding: 4px 9px; border-radius: 8px; background: rgba(16,18,28,.92); border: 2px solid; pointer-events: none; white-space: normal; text-align: center; }
.pip { position: absolute; border: 2px solid; border-radius: 4px; pointer-events: none; }
.pip b { position: absolute; left: 4px; top: 2px; font: 800 .72rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; background: rgba(16,18,28,.85); padding: 0 5px; border-radius: 2px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: rgba(11,12,19,.75); font-size: 1rem; }
.timeline { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; background: var(--stand); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.track { position: relative; height: 30px; }
.track input { position: absolute; inset: 9px 0 auto; width: 100%; padding: 0; margin: 0; background: transparent; border: 0; accent-color: var(--torch); }
.marks { position: absolute; inset: 0 0 auto; height: 8px; pointer-events: none; }
.marks i { position: absolute; top: 0; width: 3px; height: 8px; border-radius: 1px; transform: translateX(-1px); }
.marks button { position: absolute; top: -3px; width: 12px; height: 12px; padding: 0; border-radius: 50%; transform: translateX(-6px); pointer-events: auto; border: 2px solid #111; }
.time { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--dust); white-space: nowrap; }
.ticker { background: var(--stand); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: auto minmax(0, 1fr); overflow: hidden; }
.ticker .tag { background: var(--torch); color: #1b1408; font-family: var(--f-display); font-weight: 900; text-transform: uppercase; padding: 8px 12px; display: grid; place-items: center; }
.ticker ol { list-style: none; margin: 0; padding: 6px 12px; display: grid; gap: 2px; min-height: 4.6em; }
.ticker li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dust); }
.ticker li:first-child { color: var(--chalk); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.save { display: flex; gap: 6px; align-items: center; }
.save input { width: 200px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--stand-2); border: 1px solid var(--torch); padding: 8px 14px; border-radius: 6px; z-index: 5; }
@media (max-width: 700px) { .stage { height: 62vh; } .hud { width: 46%; } .timeline { grid-template-columns: auto minmax(0, 1fr) auto; } .timeline .time, #golive { grid-column: span 1; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Colosseum</h1>
    <select id="pick" aria-label="Match"></select>
    <div class="save" id="savebox">
      <input id="savename" placeholder="Match name" maxlength="80" aria-label="Match name">
      <button id="save" type="button">Save match</button>
    </div>
    <span class="spacer"></span>
    <a id="flat" href="flat">Flat view</a>
  </header>

  <div class="stage" id="stage">
    <div class="tl"><span class="badge" id="badge">loading</span><span class="chip" id="info"></span><span class="chip" id="stats" hidden></span></div>
    <div class="hud" id="hud"></div>
    <div class="overlay" id="overlay" hidden></div>
  </div>

  <div class="timeline">
    <button id="play" type="button">Pause</button>
    <button id="speed" type="button">1×</button>
    <div class="track"><div class="marks" id="marks"></div><input id="scrub" type="range" min="0" max="1000" value="1000" step="1" aria-label="Match timeline"></div>
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="golive" type="button">Go live</button>
  </div>

  <div class="ticker"><span class="tag">Showrunner</span><ol id="tick"></ol></div>

  <div class="controls">
    <div class="grp" id="g-style"><span>Look</span>
      <button type="button" data-v="stone" aria-pressed="true">Stone arena</button>
      <button type="button" data-v="wood" aria-pressed="false">Wooden labyrinth</button>
      <button type="button" data-v="blue" aria-pressed="false">Blueprint</button>
    </div>
    <div class="grp" id="g-cam"><span>Camera</span>
      <button type="button" data-v="orbit" aria-pressed="true">Orbit</button>
      <button type="button" data-v="top" aria-pressed="false">Top-down</button>
      <button type="button" data-v="follow" aria-pressed="false">Follow leader</button>
      <button type="button" id="pipbtn" aria-pressed="false">Ant cams</button>
    </div>
    <div class="grp"><span>Crowd</span><button type="button" id="crowdbtn" aria-pressed="true">On</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0'); };

// ---------- viewer key and API ----------
const VKEY = (() => { const u = new URL(location.href); let k = u.searchParams.get('key');
  try { if (k) sessionStorage.setItem('vkey', k); else k = sessionStorage.getItem('vkey'); } catch (e) {}
  if (u.searchParams.has('key')) { u.searchParams.delete('key'); history.replaceState(null, '', u); }
  return k || ''; })();
const withKey = u => VKEY ? u + (u.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(VKEY) : u;
async function api(u, opt) { const r = await fetch(withKey(u), Object.assign({ cache: 'no-store' }, opt)); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; }
$('flat').href = withKey('flat');
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }

// ---------- contestants ----------
const COLORS = { NoMoe: '#ff6b5b', Harry: '#5fa8ff', Curlee: '#7ad66f' };
const SPARE = ['#ffd35b', '#d07bff', '#5be0d0', '#ff8fd0', '#c9c9c9'];
const DEAD = { NoMoe: 'Who put a wall here?!', Harry: 'I knew it. A dead end.', Curlee: 'Hehe, wrong way again!' };

// ---------- maze geometry: any maze is room outlines + shared walls ----------
// The keeper serves 2D square grids; other shapes only need another outline function here.
let M = null;
function polysFromMap(map) {
  if (map.dims !== 2) return null;
  return map.rooms.map(r => { const [x, y] = r.coord; return [[x, y], [x + 1, y], [x + 1, y + 1], [x, y + 1]]; });
}
function buildMaze(map) {
  const raw = polysFromMap(map); if (!raw) return null;
  let A0 = 0, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of raw) { let A = 0; for (let k = 0; k < p.length; k++) { const [ax, ay] = p[k], [bx, by] = p[(k + 1) % p.length]; A += ax * by - bx * ay; x0 = Math.min(x0, ax); x1 = Math.max(x1, ax); y0 = Math.min(y0, ay); y1 = Math.max(y1, ay); } A0 += Math.abs(A) / 2; }
  const sc = 1.8 / Math.sqrt(A0 / raw.length), mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const polys = raw.map(p => p.map(([x, y]) => [(x - mx) * sc, (y - my) * sc]));
  const N = polys.length, key = ([x, y]) => Math.round(x * 500) + ',' + Math.round(y * 500);
  const segs = new Map(), pairs = new Map();
  polys.forEach((p, i) => { for (let k = 0; k < p.length; k++) { const a = p[k], b = p[(k + 1) % p.length], ka = key(a), kb = key(b);
    const sk = ka < kb ? ka + '|' + kb : kb + '|' + ka; let s = segs.get(sk); if (!s) segs.set(sk, s = { a, b, cells: [] }); if (!s.cells.includes(i)) s.cells.push(i); } });
  const pk = (i, j) => Math.min(i, j) + '|' + Math.max(i, j);
  for (const [sk, s] of segs) if (s.cells.length === 2) { const k2 = pk(s.cells[0], s.cells[1]); if (!pairs.has(k2)) pairs.set(k2, []); pairs.get(k2).push(sk); }
  const cent = polys.map(p => { let A = 0, cx = 0, cy = 0; for (let k = 0; k < p.length; k++) { const [ax, ay] = p[k], [bx, by] = p[(k + 1) % p.length], c = ax * by - bx * ay; A += c; cx += (ax + bx) * c; cy += (ay + by) * c; } return [cx / (3 * A), cy / (3 * A)]; });
  let BR = 0; for (const p of polys) for (const [x, y] of p) BR = Math.max(BR, Math.hypot(x, y));
  const m = { map, polys, N, segs, pairs, pk, cent, cell: 1.8, BR, names: map.rooms.map(r => r.name), start: map.start, goal: map.goal };
  setDoors(m, map);
  return m;
}
function setDoors(m, map) {
  m.open = new Set(map.links.map(l => m.pk(l.a, l.b)));
  m.adj = map.rooms.map(r => r.exits.slice());
  m.names = map.rooms.map(r => r.name);
  m.dist = map.rooms.map(r => r.dist);
}
const doorMid = (i, j) => { const L = M.pairs.get(M.pk(i, j)); if (!L) return [(M.cent[i][0] + M.cent[j][0]) / 2, (M.cent[i][1] + M.cent[j][1]) / 2];
  const s = M.segs.get(L[Math.floor(L.length / 2)]); return [(s.a[0] + s.b[0]) / 2, (s.a[1] + s.b[1]) / 2]; };

// ---------- looks ----------
const LOOKS = {
  stone: { floor: 0xd8c39a, fog: 0x3a3528, wall: 0x6d6a66, base: 0x2a2724, wallH: .8, amb: .3, sun: .55, torches: true, emissive: 0,
    skyTop: 0x05060f, skyBot: 0x2b2340, stand: 0x8a8378, rim: 0x5d574f, crowd: [0xd9cbb0, 0xb03a2e, 0x7a5c3a, 0xe0b05a, 0x4b6a88, 0xf2efe6, 0x8b2f5c], flood: 0xffc68a },
  wood: { floor: 0xd9b27a, fog: 0x5a4330, wall: 0x7a4a26, base: 0x4a2e18, wallH: .55, amb: .42, sun: .75, torches: false, emissive: 0,
    skyTop: 0x0b1030, skyBot: 0x6a3a2a, stand: 0x6b4426, rim: 0x3b2414, crowd: [0xe8d3b0, 0xc0392b, 0x2e86de, 0xf1c40f, 0x27ae60, 0xffffff, 0x8e44ad, 0xe67e22], flood: 0xffe2b0 },
  blue: { floor: 0x15305e, fog: 0x0c1c3c, wall: 0x7fd8ff, base: 0x0a1a38, wallH: .25, amb: .9, sun: .2, torches: false, emissive: .7,
    skyTop: 0x020716, skyBot: 0x0b2a5a, stand: 0x10264d, rim: 0x2a6fb0, crowd: [0x7fd8ff, 0x4aa3ff, 0xb3f0ff, 0xff7ad9, 0xffe16a], flood: 0x9fe6ff },
};
let LOOK = LOOKS.stone;
try { const l = localStorage.getItem('colosseum-look'); if (LOOKS[l]) LOOK = LOOKS[l]; } catch (e) {}

// ---------- three.js scene ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 16 / 9, .1, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .46; controls.minDistance = 4; controls.autoRotate = !reduce; controls.autoRotateSpeed = .4;
const amb = new THREE.HemisphereLight(0xfff1dd, 0x202030, .5); scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 1); sun.castShadow = true; scene.add(sun);
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(vP.y*1.4+0.15,0.0,1.0); gl_FragColor = vec4(mix(bot, top, pow(h,0.7)),1.0); }' });
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(140, 32, 16), skyMat); scene.add(skyMesh);
const starPts = (() => { const n = 900, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, e = .15 + Math.random() * 1.3, r = 130; p[i * 3] = Math.cos(a) * Math.cos(e) * r; p[i * 3 + 1] = Math.sin(e) * r; p[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const s = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: .7, transparent: true, opacity: .8, fog: false })); scene.add(s); return s; })();

// particles: confetti, fireworks, dust, sparks
const PN = 4000, pPos = new Float32Array(PN * 3).fill(-999), pCol = new Float32Array(PN * 3), pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN), pDrag = new Float32Array(PN), pGrav = new Float32Array(PN);
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: .28, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
pts.frustumCulled = false; scene.add(pts);
let pNext = 0;
function emit(o, n, { speed = 4, up = 2, grav = 6, life = 2, drag = .6, colors = [0xffffff] } = {}) {
  if (reduce) n = Math.ceil(n / 4); const c = new THREE.Color();
  for (let k = 0; k < n; k++) { const i = pNext; pNext = (pNext + 1) % PN; const a = Math.random() * 6.283, u = Math.random() * 2 - 1, s = speed * (.4 + Math.random() * .6), r = Math.sqrt(1 - u * u);
    pPos[i * 3] = o.x; pPos[i * 3 + 1] = o.y; pPos[i * 3 + 2] = o.z;
    pVel[i * 3] = Math.cos(a) * r * s; pVel[i * 3 + 1] = Math.abs(u) * s + up * Math.random(); pVel[i * 3 + 2] = Math.sin(a) * r * s;
    pLife[i] = life * (.6 + Math.random() * .4); pDrag[i] = drag; pGrav[i] = grav; c.set(colors[Math.floor(Math.random() * colors.length)]); pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b; } }
function stepParticles(dt) { const s = dt / 1000;
  for (let i = 0; i < PN; i++) { if (pLife[i] <= 0) continue; pLife[i] -= s; if (pLife[i] <= 0) { pPos[i * 3 + 1] = -999; continue; }
    const d = Math.pow(pDrag[i], s); pVel[i * 3] *= d; pVel[i * 3 + 2] *= d; pVel[i * 3 + 1] = pVel[i * 3 + 1] * d - pGrav[i] * s;
    pPos[i * 3] += pVel[i * 3] * s; pPos[i * 3 + 1] = Math.max(.03, pPos[i * 3 + 1] + pVel[i * 3 + 1] * s); pPos[i * 3 + 2] += pVel[i * 3 + 2] * s;
    if (pLife[i] < .5) { pCol[i * 3] *= .96; pCol[i * 3 + 1] *= .96; pCol[i * 3 + 2] *= .96; } }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; }
const queue = []; const later = (ms, fn) => queue.push({ at: performance.now() + ms, fn });
const flash = new THREE.PointLight(0xffffff, 0, 60); scene.add(flash); let flashT = 0, shake = 0;
function flashLight(o, c) { flash.position.copy(o); flash.color.set(c); flashT = 1; }
function fireworks(n) { for (let k = 0; k < n; k++) later(k * 380 + Math.random() * 200, () => {
  const a = Math.random() * 6.283, r = M.BR * (.4 + Math.random() * .9), o = new THREE.Vector3(Math.cos(a) * r, 10 + M.BR * .3 + Math.random() * 6, Math.sin(a) * r);
  const pal = [[0xff5d5d, 0xffd36b], [0x6fd39b, 0xffffff], [0x5fa8ff, 0xb3f0ff], [0xffb347, 0xff6bd5]][k % 4];
  emit(o, 160, { speed: 7, up: 0, grav: 2.2, life: 2.2, drag: .35, colors: pal }); flashLight(o, pal[0]); }); }

const W2 = ([x, y], h = 0) => new THREE.Vector3(x, h, y);
let world = null, dyn = new THREE.Group(), floorGeo, floorCols, wallMesh, beacon, torchLights = [], crowd = null, banners = [], rising = [], prints = null;
let hype = 0, wave = -9, groan = 0, crowdOn = true;
scene.add(dyn);

function clearGroup(g) { g.traverse(o => { o.geometry && o.geometry.dispose(); if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose()); }); }
function buildWorld() {
  if (world) { scene.remove(world); clearGroup(world); }
  world = new THREE.Group(); scene.add(world); torchLights = []; banners = []; rising = [];
  const BR = M.BR, SK = Math.max(1, (BR + 30) / 70);
  skyMesh.scale.setScalar(SK); starPts.scale.setScalar(SK);

      tgt.copy(g.position).addScaledVector(fwd, M.cell * .8); c.lookAt(tgt); c.aspect = 4 / 3; c.updateProjectionMatrix();
