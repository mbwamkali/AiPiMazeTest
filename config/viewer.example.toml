# Colosseum viewer settings: python3 -m arena.viewer --config ~/hypermaze/config/viewer.toml
# Copy to ~/hypermaze/config/viewer.toml and uncomment what you need.
# Precedence: command-line flag > environment variable > this file > built-in default.
# Never put keys in this file: only the path to keys.json.

# Where the viewer listens. 0.0.0.0 opens it to the network; default 127.0.0.1:7344.
# listen = "0.0.0.0:7344"

# The keeper's admin URL (the viewer runs next to the keeper).
# keeper = "http://127.0.0.1:7342"

# keys.json holding "admin" (to sign keeper calls) and "viewer" (what visitors pass as ?key=).
# keys_file = "~/hypermaze-keeper-data/keys.json"

# HTTPS for the viewer.
# tls_cert = "~/hypermaze-keeper-data/tls/viewer-chain.crt"
# tls_key = "~/hypermaze-keeper-data/tls/viewer.key"

# host[:port] that http:// visitors are redirected to (https) when their Host header is unusable.
# public_host = "<keeper-host>:7344"

# The main page: the 3D Colosseum (default: viewer/colosseum.html in this repository).
# page = "~/hypermaze/app/viewer/colosseum.html"

# The flat grid view, served at /flat (default: viewer/index.html in this repository).
# flat_page = "~/hypermaze/app/viewer/index.html"

# Where saved matches are kept, on this machine only (default ~/hypermaze/colosseum/matches).
# matches_dir = "~/hypermaze/colosseum/matches"

# Let the page start matches: the keeper makes one run per chosen ant, and each ant's agent picks
# its run up. Anyone with the viewer key can then start matches. Default false.
# allow_new_matches = true
